<html lang="es">

<!-- Leaflet CSS & JS para el mapa de entrega -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f0eb; color: #2c2c2c; }

  header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: white;
    text-align: center;
    padding: 30px 20px 20px;
  }
  header h1 { font-size: 2rem; letter-spacing: 3px; }
  header p { color: #c9a96e; margin-top: 5px; letter-spacing: 1px; }

  .cart-bar {
    background: #c9a96e;
    color: #1a1a2e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .cart-bar span { font-weight: bold; font-size: 0.95rem; }
  .cart-bar button {
    background: #1a1a2e;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .cart-bar button:hover { background: #16213e; }

  .search-bar {
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .search-bar input {
    width: 100%;
    max-width: 400px;
    padding: 10px 16px;
    border: 1px solid #ddd;
    border-radius: 25px;
    font-size: 0.95rem;
    outline: none;
  }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .filter-btn {
    background: white;
    border: 2px solid #1a1a2e;
    color: #1a1a2e;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: #1a1a2e;
    color: white;
  }

  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    padding: 10px 20px 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .brand-title {
    grid-column: 1 / -1;
    font-size: 1.1rem;
    font-weight: bold;
    color: #1a1a2e;
    padding: 10px 4px 2px;
    border-bottom: 2px solid #c9a96e;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card img {
    width: 130px;
    height: 130px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .card h3 { font-size: 0.95rem; margin-bottom: 6px; min-height: 40px; }
  .card .price { color: #c9a96e; font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
  .card button {
    background: #1a1a2e;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .card button:hover { background: #c9a96e; color: #1a1a2e; }
  .card button.added { background: #2ecc71; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    justify-content: flex-end;
  }
  .overlay.open { display: flex; }
  .cart-panel {
    background: white;
    width: 100%;
    max-width: 420px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
    position: relative;
  }
  .cart-panel h2 { margin-bottom: 15px; font-size: 1.3rem; }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding: 10px 0;
    gap: 10px;
  }
  .cart-item span { flex: 1; font-size: 0.9rem; }
  .cart-item .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .cart-item .qty-ctrl button {
    background: #eee;
    border: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
  }
  .cart-item .item-price { font-weight: bold; color: #c9a96e; font-size: 0.9rem; min-width: 70px; text-align: right; }
  .cart-item .remove { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 1.1rem; }
  .cart-total { margin-top: 15px; font-size: 1.1rem; font-weight: bold; text-align: right; }
  .btn-whatsapp {
    margin-top: 15px;
    background: #25D366;
    color: white;
    border: none;
    padding: 14px;
    border-radius: 25px;
    width: 100%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-whatsapp:hover { background: #1ebe5d; }
  .btn-close {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    position: absolute;
    right: 20px;
    top: 15px;
  }
  .empty-cart { text-align: center; color: #aaa; margin-top: 40px; }

  @media (max-width: 480px) {
    header h1 { font-size: 1.5rem; }
    .products { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px; }
    .card { padding: 12px; }
    .card img { width: 100px; height: 100px; }
  }

  /* Modal de detalles de producto */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.open {
    display: flex;
    opacity: 1;
  }
  .modal-card {
    background: white;
    width: 100%;
    max-width: 550px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    position: relative;
    padding: 24px;
    transform: translateY(20px);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal-overlay.open .modal-card {
    transform: translateY(0);
  }
  .modal-close {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #888;
    transition: color 0.2s;
  }
  .modal-close:hover { color: #1a1a2e; }
  .modal-body {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .modal-img-container {
    width: 180px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f0eb;
    border-radius: 12px;
    padding: 10px;
    flex-shrink: 0;
  }
  .modal-img-container img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .modal-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-brand {
    font-size: 0.85rem;
    font-weight: bold;
    color: #c9a96e;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal-name {
    font-size: 1.4rem;
    font-weight: bold;
    color: #1a1a2e;
  }
  .modal-desc {
    font-size: 0.95rem;
    color: #555;
    line-height: 1.4;
  }
  .modal-notes-label {
    font-weight: bold;
    font-size: 0.85rem;
    color: #2c2c2c;
    margin-top: 4px;
  }
  .modal-notes {
    font-size: 0.85rem;
    color: #666;
    font-style: italic;
  }
  .modal-price {
    font-size: 1.3rem;
    font-weight: bold;
    color: #c9a96e;
    margin-top: 4px;
  }
  .modal-action {
    margin-top: 10px;
    display: flex;
    gap: 12px;
  }
  .modal-btn-add {
    flex: 1;
    background: #1a1a2e;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  .modal-btn-add:hover { background: #c9a96e; color: #1a1a2e; }
  .modal-btn-add.added { background: #2ecc71; color: white; }

  /* Estilos para Checkout y Mapa */
  .checkout-title {
    font-size: 1.25rem;
    font-weight: bold;
    color: #1a1a2e;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
    text-align: left;
  }
  .form-group label {
    font-size: 0.85rem;
    font-weight: bold;
    color: #1a1a2e;
  }
  .form-group input, .form-group select {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: #c9a96e;
  }
  
  .payment-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .payment-option {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    user-select: none;
  }
  .payment-option:hover {
    border-color: #c9a96e;
    background: #fbf9f6;
  }
  .payment-option input {
    width: auto !important;
    accent-color: #1a1a2e;
    margin: 0;
    cursor: pointer;
  }
  
  .map-search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .map-search-bar input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
  }
  .map-search-bar button {
    background: #1a1a2e;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;

  .map-search-bar button:hover {
    background: #c9a96e;
    color: #1a1a2e;

  #checkout-map {
    height: 200px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-bottom: 12px;
    z-index: 10;

  .btn-back-to-cart {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    width: fit-content;

  .btn-back-to-cart:hover {

  .checkout-info-alert {
    font-size: 0.8rem;
    color: #8a6d3b;
    background: #fcf8e3;

</style>

<body>

<header>
  <h1>✨ FRAGANCIAS NVG</h1>

</header>

<div class="cart-bar">
  <span>🛒 Carrito: <span id="cart-count">0</span> producto(s)</span>
  <button onclick="toggleCart()">Ver carrito</button>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="🔍 Buscar perfume..." oninput="filterProducts()">
</div>

<div class="filter-bar" id="filter-bar"></div>
<div class="products" id="products-grid"></div>

<!-- CARRITO -->
<div class="overlay" id="overlay" onclick="closeOnOverlay(event)">
  <div class="cart-panel">
    <button class="btn-close" onclick="toggleCart()">✕</button>
    
    <!-- PANTALLA 1: LISTADO DE PRODUCTOS EN CARRITO -->
    <div id="cart-screen">
      <h2>🛒 Tu Pedido</h2>
      <div id="cart-items"><p class="empty-cart">Tu carrito está vacío</p></div>
      <div class="cart-total" id="cart-total"></div>
      <button class="btn-whatsapp" style="background:#1a1a2e;" onclick="showCheckoutScreen()">
        Continuar con el pedido
      </button>
    </div>

    <!-- PANTALLA 2: DATOS DE CHECKOUT Y MAPA -->
    <div id="checkout-screen" style="display:none;">
      <button class="btn-back-to-cart" onclick="showCartScreen()">← Volver al carrito</button>
      <h2 class="checkout-title">📝 Datos de Entrega</h2>
      
      <div class="form-group">
        <label for="checkout-name">Nombre Completo *</label>
        <input type="text" id="checkout-name" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label>Método de Pago *</label>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="payment-method" value="Transferencia Bancaria" checked>
            <span>🏦 Transferencia Bancaria</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment-method" value="Efectivo al recibir">
            <span>💵 Efectivo al recibir (Contra entrega)</span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment-method" value="Mercado Pago">
            <span>📱 Mercado Pago</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="checkout-address">Dirección de Entrega *</label>
        <input type="text" id="checkout-address" placeholder="Ej. Av. Santa Fe 1234, CABA" required>
      </div>

      <div class="form-group">
        <label>Buscar dirección en el mapa</label>
        <div class="map-search-bar">
          <input type="text" id="map-search" placeholder="Ej. Obelisco, Buenos Aires" onkeydown="if(event.key === 'Enter') { event.preventDefault(); searchAddress(); }">
          <button type="button" onclick="searchAddress()">Buscar</button>
        </div>
      </div>

      <div class="checkout-info-alert">
        📍 Arrastra el marcador en el mapa para indicar la ubicación exacta de entrega.
      </div>
      
      <div id="checkout-map"></div>

        Confirmar y Enviar por WhatsApp
      </button>
    </div>
  </div>
</div>

let cart = {};
let activeBrand = "Todos";
let currentProductId = null;

// Variables para el Mapa Leaflet
let map = null;
let marker = null;
let selectedCoords = { lat: -34.6037, lng: -58.3816 }; // Buenos Aires por defecto

function formatPrice(n) {
  return "$" + n.toLocaleString("es-AR");
}

function renderFilters() {
  const allBrands = ["Todos", ...new Set(products.map(p => p.brand))];
  document.getElementById("filter-bar").innerHTML = allBrands.map(b =>
    `<button class="filter-btn ${b === activeBrand ? 'active' : ''}" onclick="setBrand('${b}')">${b}</button>`
  ).join("");
}

function setBrand(brand) {
  activeBrand = brand;
  document.getElementById("search").value = "";
  renderFilters();
  renderProducts(getFiltered());
}

function getFiltered() {
  const q = document.getElementById("search").value.toLowerCase();
  return products.filter(p =>
    (activeBrand === "Todos" || p.brand === activeBrand) &&
    p.name.toLowerCase().includes(q)
  );
}

function cardHTML(p) {
  const src = p.img ? p.img : FALLBACK;
  return `
    <div class="card" onclick="openProductModal(${p.id})">
      <img src="${src}" alt="${p.name}" onerror="this.src='${FALLBACK}'">
      <h3>${p.name}</h3>
      <div class="price">${formatPrice(p.price)}</div>
      <button id="btn-${p.id}" onclick="event.stopPropagation(); addToCart(${p.id})">Agregar al carrito</button>
    </div>`;
}

function renderProducts(list) {
  const grid = document.getElementById("products-grid");
  if (!list.length) { grid.innerHTML = '<p style="padding:20px;color:#aaa">No se encontraron productos</p>'; return; }
  if (activeBrand === "Todos") {
    const grouped = {};
    list.forEach(p => { if (!grouped[p.brand]) grouped[p.brand] = []; grouped[p.brand].push(p); });
    grid.innerHTML = Object.entries(grouped).map(([brand, items]) =>
      `<div class="brand-title">🏷 ${brand}</div>` + items.map(cardHTML).join("")
    ).join("");
  } else {
    grid.innerHTML = list.map(cardHTML).join("");
  }
}

function filterProducts() { renderProducts(getFiltered()); }

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  updateCartCount();
  const btn = document.getElementById("btn-" + id);
  if (btn) {
    btn.textContent = "✓ Agregado";
    btn.classList.add("added");
    setTimeout(() => { btn.textContent = "Agregar al carrito"; btn.classList.remove("added"); }, 1200);
  }
}

function removeFromCart(id) { delete cart[id]; renderCart(); updateCartCount(); }

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  renderCart(); updateCartCount();
}

function updateCartCount() {
  document.getElementById("cart-count").textContent = Object.values(cart).reduce((a, b) => a + b, 0);
}

function renderCart() {
  const container = document.getElementById("cart-items");
  const keys = Object.keys(cart);
  if (!keys.length) {
    container.innerHTML = '<p class="empty-cart">Tu carrito está vacío</p>';
    document.getElementById("cart-total").textContent = "";
    return;
  }
  let total = 0;
  container.innerHTML = keys.map(id => {
    const p = products.find(x => x.id == id);
    const subtotal = p.price * cart[id];
    total += subtotal;
    return `<div class="cart-item">
      <span>${p.name}</span>
      <div class="qty-ctrl">
        <button onclick="changeQty(${id},-1)">−</button>
        <span>${cart[id]}</span>
        <button onclick="changeQty(${id},1)">+</button>
      </div>
      <span class="item-price">${formatPrice(subtotal)}</span>
      <button class="remove" onclick="removeFromCart(${id})">🗑</button>
    </div>`;
  }).join("");
  document.getElementById("cart-total").textContent = "Total: " + formatPrice(total);
}

function toggleCart() {
  renderCart();
  showCartScreen();
  document.getElementById("overlay").classList.toggle("open");
}

function closeOnOverlay(e) {
  if (e.target === document.getElementById("overlay")) toggleCart();
}

/* --- LÓGICA DE DETALLES DEL PRODUCTO --- */
function openProductModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  currentProductId = id;
  document.getElementById("modal-img").src = p.img ? p.img : FALLBACK;
  document.getElementById("modal-img").onerror = function() { this.src = FALLBACK; };
  document.getElementById("modal-brand").textContent = p.brand;
  document.getElementById("modal-name").textContent = p.name;
  document.getElementById("modal-desc").textContent = p.desc || "Fragancia de calidad internacional con gran proyección.";
  document.getElementById("modal-notes").textContent = p.notes || "Notas equilibradas de alta perfumería.";
  document.getElementById("modal-price").textContent = formatPrice(p.price);
  
  const modalBtn = document.getElementById("modal-btn-add");
  modalBtn.textContent = "Agregar al carrito";
  modalBtn.className = "modal-btn-add";
  
  const modal = document.getElementById("product-modal");
  modal.style.display = "flex";
  modal.offsetHeight; // Forzar reflow para animación
  modal.classList.add("open");
}

function closeProductModal() {
  const modal = document.getElementById("product-modal");
  modal.classList.remove("open");
  setTimeout(() => {
    if (!modal.classList.contains("open")) {
      modal.style.display = "none";
    }
  }, 300);
}

function closeProductModalOnOverlay(e) {
  if (e.target === document.getElementById("product-modal")) {
    closeProductModal();
  }
}

function addProductFromModal() {
  if (currentProductId === null) return;
  addToCart(currentProductId);
  const btn = document.getElementById("modal-btn-add");
  btn.textContent = "✓ Agregado al Carrito";
  btn.classList.add("added");
  setTimeout(() => {
    btn.textContent = "Agregar al carrito";
    btn.classList.remove("added");
  }, 1200);
}

/* --- LÓGICA DE CHECKOUT Y MAPA --- */
function showCheckoutScreen() {
  const keys = Object.keys(cart);
  if (!keys.length) { alert("Tu carrito está vacío"); return; }
  
  document.getElementById("cart-screen").style.display = "none";
  document.getElementById("checkout-screen").style.display = "block";
  
  // Inicializar Leaflet con un pequeño delay para que el contenedor esté visible y renderizado
  setTimeout(() => {
    initCheckoutMap();
  }, 150);
}

function showCartScreen() {
  document.getElementById("checkout-screen").style.display = "none";
  document.getElementById("cart-screen").style.display = "block";
}

function initCheckoutMap() {
  if (map) {
    map.invalidateSize();
    return;
  }
  
  map = L.map('checkout-map', {
    zoomControl: true,
    scrollWheelZoom: true
  }).setView([selectedCoords.lat, selectedCoords.lng], 13);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);
  
  marker = L.marker([selectedCoords.lat, selectedCoords.lng], {
    draggable: true
  }).addTo(map);
  
  marker.on('dragend', function (e) {
    const position = marker.getLatLng();
    selectedCoords.lat = position.lat.toFixed(6);
    selectedCoords.lng = position.lng.toFixed(6);
    reverseGeocode(position.lat, position.lng);
  });
  
  map.on('click', function (e) {
    marker.setLatLng(e.latlng);
    selectedCoords.lat = e.latlng.lat.toFixed(6);
    selectedCoords.lng = e.latlng.lng.toFixed(6);
    reverseGeocode(e.latlng.lat, e.latlng.lng);
  });
  
  // Intentar geolocalizar al usuario automáticamente si otorga permisos
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      selectedCoords.lat = lat.toFixed(6);
      selectedCoords.lng = lng.toFixed(6);
      map.setView([lat, lng], 15);
      marker.setLatLng([lat, lng]);
      reverseGeocode(lat, lng);
    }, function(error) {
      console.log("Acceso a geolocalización denegado o no disponible.");
    });
  }
}

async function searchAddress() {
  const query = document.getElementById("map-search").value;
  if (!query) return;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (data && data.length > 0) {
      const result = data[0];
      const lat = parseFloat(result.lat);
      const lon = parseFloat(result.lon);
      selectedCoords.lat = lat.toFixed(6);
      selectedCoords.lng = lon.toFixed(6);
      map.setView([lat, lon], 16);
      marker.setLatLng([lat, lon]);
      
      const addressInput = document.getElementById("checkout-address");
      const addressParts = result.display_name.split(',');
      addressInput.value = addressParts.slice(0, 3).join(',').trim();
    } else {
      alert("No se encontró la dirección especificada.");
    }
  } catch (err) {
    console.error("Error al buscar la dirección:", err);
  }
}

async function reverseGeocode(lat, lng) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    const data = await res.json();
    if (data && data.display_name) {
      const parts = data.display_name.split(',');
      const shortAddress = parts.slice(0, 3).join(',').trim();
      document.getElementById("checkout-address").value = shortAddress;
    }
  } catch (err) {
    console.error("Error de geocodificación inversa:", err);
  }
}

function confirmAndSendWhatsApp() {
  const name = document.getElementById("checkout-name").value.trim();
  const address = document.getElementById("checkout-address").value.trim();
  
  if (!name) { alert("Por favor, ingresa tu nombre completo."); return; }
  if (!address) { alert("Por favor, ingresa tu dirección de entrega."); return; }
  
  const paymentRadio = document.querySelector('input[name="payment-method"]:checked');
  const paymentMethodVal = paymentRadio ? paymentRadio.value : "Transferencia Bancaria";
  
  const keys = Object.keys(cart);
  if (!keys.length) { alert("Tu carrito está vacío"); return; }
  
  let msg = "✨ *NUEVO PEDIDO - FRAGANCIAS NVG* ✨\n\n";
  msg += `👤 *Cliente:* ${name}\n`;
  msg += `💳 *Método de Pago:* ${paymentMethodVal}\n`;
  msg += `📍 *Dirección de Entrega:* ${address}\n`;
  
  const mapLink = `https://www.google.com/maps?q=${selectedCoords.lat},${selectedCoords.lng}`;
  msg += `🗺 *Ubicación de Entrega (Mapa):* ${mapLink}\n\n`;
  
  msg += "🛒 *Detalles del Pedido:*\n";
  let total = 0;
  keys.forEach(id => {
    const p = products.find(x => x.id == id);
    const sub = p.price * cart[id];
    total += sub;
    msg += `• ${p.name} (x${cart[id]}) = ${formatPrice(sub)}\n`;
  });
  
  msg += `\n*Total a Pagar: ${formatPrice(total)}*`;
  
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, "_blank");
}

renderFilters();
renderProducts(products);
