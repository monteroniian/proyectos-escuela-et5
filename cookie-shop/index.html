<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍪 Cookie Shop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">🍪 Cookie Shop</div>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>¡Las mejores galletitas artesanales! 🎉</h1>
    <p>Hechas con amor, ingredientes naturales y mucho sabor</p>
  </section>

  <!-- PRODUCTOS -->
  <main class="products-section">
    <h2 class="section-title">Nuestras Galletitas</h2>
    <div class="products-grid" id="products-grid"></div>
  </main>

  <!-- CARRITO LATERAL -->
  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <aside class="cart-panel" id="cart-panel">
    <div class="cart-header">
      <h2>🛒 Tu Carrito</h2>
      <button class="close-btn" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p class="empty-msg">Tu carrito está vacío 🍪</p>
    </div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="total-row">
        <span>Total:</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Comprar ahora 🎉</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
