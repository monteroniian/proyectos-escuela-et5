<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notas de Estudiantes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- AUTH -->
  <div id="auth-section">
    <div class="card">
      <h1>Notas de Estudiantes</h1>
      <p class="subtitle">Registrate o iniciá sesión para ver las notas. Usá un correo <strong>profesor@...</strong> para modificarlas.</p>
      <input id="auth-name" type="text" placeholder="Tu nombre" />
      <input id="auth-email" type="email" placeholder="Correo electrónico (ej. profesor@escuela.com)" />
      <input id="auth-password" type="password" placeholder="Contraseña (mín. 6 caracteres)" />
      <div class="auth-buttons">
        <button onclick="register()">Registrarse</button>
        <button onclick="login()" class="secondary">Iniciar sesión</button>
      </div>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="app-section" class="hidden">
    <header>
      <div>
        <div class="header-title-row">
          <h2 class="app-title">Notas de Estudiantes</h2>
          <span id="user-role-badge" class="role-badge"></span>
        </div>
        <div class="user-info">
          <span>Hola, <strong id="user-name"></strong></span>
          <span id="user-email" class="email-label"></span>
        </div>
      </div>
      <button onclick="logout()" class="secondary small">Cerrar sesión</button>
    </header>

    <main>
      <div id="professor-panel" class="add-note hidden">
        <h3 id="form-heading">Agregar nota de estudiante</h3>
        <input id="editing-note-id" type="hidden" value="" />
        <div class="note-row-3">
          <input id="note-student" type="text" placeholder="Nombre del estudiante" />
          <input id="note-title" type="text" placeholder="Materia" />
          <input id="note-grade" type="number" min="1" max="10" step="0.5" placeholder="Nota (1-10)" />
        </div>
        <textarea id="note-body" placeholder="Observaciones (opcional)..."></textarea>
        <div class="form-actions">
          <button id="btn-save-note" onclick="saveNote()">Guardar nota</button>
          <button id="btn-cancel-edit" onclick="cancelEdit()" class="secondary hidden">Cancelar edición</button>
        </div>
        <p id="note-error" class="error"></p>
      </div>

      <section class="notes-section">
        <h3>Notas registradas en la base de datos</h3>
        <div id="notes-list"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
